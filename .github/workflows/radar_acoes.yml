name: Radar de Ações (apuração diária)

on:
  schedule:
    - cron: "30 21 * * 1-5"   # dias úteis, 18h30 de Brasília (após o fechamento da B3)
  workflow_dispatch:
    inputs:
      aporte:
        description: "Valor do aporte do mês (R$)"
        required: false
        default: ""

jobs:
  apurar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: radar_acoes
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: radar_acoes/requirements.txt
      - run: pip install -r requirements.txt
      # guarda o histórico entre execuções para detectar o que mudou de um dia para o outro
      - uses: actions/cache@v4
        with:
          path: radar_acoes/dados_acoes/historico
          key: radar-acoes-historico-${{ github.run_id }}
          restore-keys: radar-acoes-historico-
      - name: Carteira (opcional, do segredo CARTEIRA_CSV)
        env:
          CARTEIRA_CSV: ${{ secrets.CARTEIRA_CSV }}
        run: |
          mkdir -p dados_acoes
          if [ -n "$CARTEIRA_CSV" ]; then printf '%s\n' "$CARTEIRA_CSV" > dados_acoes/carteira.csv; fi
      - name: Apurar e enviar alertas
        env:
          APORTE_MENSAL: ${{ github.event.inputs.aporte || vars.APORTE_MENSAL }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          EMAIL_REMETENTE: ${{ secrets.EMAIL_REMETENTE }}
          EMAIL_SENHA: ${{ secrets.EMAIL_SENHA }}
          EMAIL_DESTINO: ${{ secrets.EMAIL_DESTINO }}
        run: python apurar.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: relatorio-acoes
          path: |
            radar_acoes/dados_acoes/relatorios/
            radar_acoes/dados_acoes/historico/
          retention-days: 30
